<section id="play" class="panel" aria-labelledby="play-title"><div class="section-heading"><div><p class="eyebrow" data-en="THE SORTING CHALLENGE" data-zh="垃圾分类挑战"></p><h2 id="play-title" data-en="Which bin is home?" data-zh="它的家是哪个垃圾桶？"></h2></div><div class="stats"><span><small data-en="SCORE" data-zh="得分"></small><b id="score">0</b></span><span><small data-en="ROUND" data-zh="题目"></small><b id="round">— / 8</b></span><span><small data-en="BEST" data-zh="最佳"></small><b id="best">0</b></span></div></div>
<div class="game-field"><div class="landscape" aria-hidden="true"><i></i><i></i><i></i></div><div id="object-card" class="object-card" draggable="false"><span id="object-emoji">🌱</span><h3 id="object-name"></h3><p id="object-hint"></p></div><button class="primary" id="start" data-en="Let’s play →" data-zh="开始游戏 →"></button><div id="feedback" class="feedback" role="status" aria-live="polite"></div><button id="next" class="primary" hidden data-en="Next object →" data-zh="下一个物品 →"></button><div id="bins" class="bins"></div></div>
<div class="game-foot"><span data-en="Drag the object on desktop, or tap a bin. +10 correct · −10 incorrect." data-zh="电脑上可拖动，或直接点击垃圾桶。答对 +10 分，答错 −10 分。"></span><button class="text-button" id="reset" data-en="New round ↻" data-zh="重新开始 ↻"></button></div><p class="scope" data-en="Learning model: the original project’s Shanghai-style four categories, with archived 2021 data. Local sorting rules can differ." data-zh="学习模型：原项目采用的上海四分类及 2021 年归档数据。不同地区的投放规则可能不同。"></p></section>
<section id="search" class="panel" hidden><div class="section-heading"><div><p class="eyebrow" data-en="THE OBJECT LIBRARY" data-zh="物品分类库"></p><h2 data-en="Small question. Clear answer." data-zh="小小疑问，找到答案。"></h2></div><span class="pill" id="library-count"></span></div><label class="search-box"><span>⌕</span><input id="query" type="search" autocomplete="off" aria-label="Search waste item" placeholder="Try bottle, banana, paper cup… / 塑料瓶、香蕉皮、纸杯"></label><div class="chips" id="filters"></div><p id="result-count" role="status"></p><div id="results" class="results"></div><button id="more" class="secondary" hidden data-en="Show more" data-zh="显示更多"></button><p class="scope" data-en="The complete original Chinese library is preserved. English search covers the curated game objects. Results may contain historical ambiguities; use local guidance for real disposal." data-zh="完整保留原中文分类库；英文搜索覆盖游戏精选物品。历史数据可能有歧义，实际投放请参考当地指南。"></p></section>
<section id="photo" class="panel" hidden><div class="section-heading"><div><p class="eyebrow" data-en="THE PHOTO LAB" data-zh="拍照实验室"></p><h2 data-en="A photo is just the beginning." data-zh="一张照片，只是第一步。"></h2></div><span class="pill" id="recognition-mode"></span></div><p class="section-copy" data-en="The original app recognised an object, asked the learner to choose a label, then searched the waste library. Explore that two-stage process below." data-zh="原程序先识别物品，再由用户选择名称，最后搜索垃圾分类。下方展示这两阶段流程。"></p><div class="photo-grid"><div class="photo-preview"><img id="photo-image" src="assets/recognition-cup.jpg" alt="Original paper cup recognition test"><span id="photo-badge"></span></div><div><div class="steps"><span data-step="0">1 · <b data-en="Photo" data-zh="照片"></b></span><span data-step="1">2 · <b data-en="Object label" data-zh="物品名称"></b></span><span data-step="2">3 · <b data-en="Waste category" data-zh="垃圾分类"></b></span></div><h3 data-en="Try the archived examples" data-zh="体验归档示例"></h3><div class="sample-buttons"><button class="secondary" data-sample="cup" data-en="Paper cup" data-zh="纸杯"></button><button class="secondary" data-sample="tissue" data-en="Tissue" data-zh="餐巾纸"></button></div><p id="photo-note"></p><button id="walkthrough" class="primary" data-en="Walk through this example →" data-zh="演示这个示例 →"></button><div id="candidates" class="chips"></div><div id="photo-result" class="photo-result" role="status"></div><div class="upload-box"><label for="upload" data-en="Or choose your own photo" data-zh="也可以选择自己的照片"></label><input id="upload" type="file" accept="image/jpeg,image/png" capture="environment"><p class="scope" data-en="On the public demo, your photo stays on this device. Type its name to classify it. Live AI is available only through the optional local server." data-zh="公开演示中照片仅保留在本设备。输入名称即可查分类。实时 AI 需要可选的本地服务器。"></p><div class="manual"><input id="manual-name" aria-label="Name of photographed object" placeholder="Object name / 物品名称"><button id="manual-search" class="secondary" data-en="Find bin" data-zh="查分类"></button></div><button id="live-recognize" class="secondary" hidden data-en="Send to Baidu for recognition" data-zh="发送给百度进行识别"></button></div></div></div></section>
<section id="story" class="panel" hidden><div class="section-heading"><div><p class="eyebrow" data-en="BEHIND THE APP" data-zh="应用背后的故事"></p><h2 data-en="An idea, built step by step." data-zh="从想法，到一步步实现。"></h2></div><span class="pill">2021–2022</span></div><p class="section-copy" data-en="An East China University of Science and Technology student project, supervised by Zhou Jiale. Jinxiao Wan built the sorting game and integrated it with a teammate’s recognition feature." data-zh="华东理工大学学生项目，指导教师周家乐。万金潇完成分类游戏，并与同组同学的拍照识别功能进行整合。"></p><div class="story-timeline"><article><span>01</span><h3 data-en="Understand the learner" data-zh="了解学习者"></h3><p data-en="Designed for children aged 3–14. Requirement analysis combined exhaustive exploration with the Kano model." data-zh="面向 3–14 岁儿童，将穷举抓重点法与卡诺模型结合进行需求分析。"></p></article><article><span>02</span><h3 data-en="Make learning playful" data-zh="让学习更有趣"></h3><p data-en="Four virtual bins, draggable objects, +10 / −10 scoring and feedback sounds turned classification into a game." data-zh="四个虚拟垃圾桶、拖拽物品、正负十分及声音反馈，将分类变成游戏。"></p></article><article><span>03</span><h3 data-en="Connect recognition & search" data-zh="连接识别与搜索"></h3><p data-en="Baidu object recognition supplied candidate names; the selected name was matched to a local waste dictionary." data-zh="百度物体识别返回候选名称，选择名称后再匹配本地垃圾分类字典。"></p></article><article><span>04</span><h3 data-en="Test, question, improve" data-zh="测试、发现问题、改进"></h3><p data-en="Tests found errors with yellow tissues and distracting backgrounds. Object recognition did not guarantee a correct waste category." data-zh="测试发现黄色纸巾及背景干扰会导致识别错误。物体识别不保证分类正确。"></p></article></div><div class="archive-heading"><h3 data-en="The original screens" data-zh="原始界面"></h3><p data-en="Images extracted from the project’s final report. Click to enlarge." data-zh="图片来自原项目结题报告，可点击放大。"></p></div><div class="gallery" id="gallery"></div><div class="hardware-note"><h3 data-en="Where does Raspberry Pi fit?" data-zh="树莓派在项目中的角色？"></h3><p data-en="Raspberry Pi appears in the original project title. The supplied evidence documents the WeChat app; it contains no verified GPIO program, wiring diagram or completed Pi prototype. This reconstruction can run in a Pi browser as a new kiosk option." data-zh="树莓派出现在原项目名称中，附件记录的是微信应用；未发现可验证的 GPIO 程序、接线图或已完成的树莓派原型。本次重建可作为新的终端方案运行在树莓派浏览器中。"></p><a href="https://github.com/jinxiao-wan/Raspberry-Pi-Children-s-Garbage-Sorting-Learning-System/tree/main/docs" data-en="Read the architecture & source audit ↗" data-zh="查看架构与资料审查 ↗"></a></div></section>
